name: validate

# Read-only CI: no pull_request_target, no caches, no secrets.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Safety gate
        run: bash tools/check-plugin.sh plugins/si

      - name: Safety gate (si-auto)
        run: bash tools/check-si-auto.sh plugins/si-auto

      # No Claude, no network: each hook is fed the JSON Claude Code would send.
      - name: si-auto tests
        run: |
          bash tests/si-auto/run-unit.sh
          bash tests/si-auto/run-gate.sh

      # Pinned gitleaks binary, verified against a hardcoded sha256 (not the
      # release's own checksum file) so a tampered release cannot pass.
      - name: Secret scan (gitleaks)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" detect --no-git -s plugins/si --redact --no-banner -v
          "$RUNNER_TEMP/gitleaks" detect --no-git -s plugins/si-auto --redact --no-banner -v

      - name: Install Claude Code (native installer, no npm)
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # --strict is not used: it demands a "version" field, and the plugin
      # deliberately has none so its version is the commit and updates flow.
      - name: Validate marketplace and plugin
        run: |
          claude plugin validate .
          claude plugin validate plugins/si
          claude plugin validate plugins/si-auto
